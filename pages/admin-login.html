<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Access | NaijaBiz</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0f172a; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        .login-card { background: white; padding: 40px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .logo-area { text-align: center; margin-bottom: 30px; }
        h2 { font-family: 'Outfit'; text-align: center; color: #0f172a; margin-bottom: 10px; }
        p { text-align: center; color: #64748b; font-size: 0.9rem; margin-bottom: 30px; }
        .btn-admin { width: 100%; padding: 14px; background: #008751; color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-admin:hover { background: #006b40; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-area">
            <span style="font-size: 1.5rem; font-weight: 800; color: #0f172a;">Naija<span style="color:#008751;">Biz</span> Admin</span>
        </div>
        <h2>Secure Entry</h2>
        <p>Enter administrator credentials to proceed.</p>

        <form id="adminLoginForm">
            <div class="form-group">
                <label>System Email</label>
                <input type="email" id="adminEmail" required style="width:100%; padding:12px; border:1px solid #e2e8f0; border-radius:8px;">
            </div>
            <div class="form-group" style="margin-top:20px; margin-bottom:30px;">
                <label>Access Key</label>
                <input type="password" id="adminPass" required style="width:100%; padding:12px; border:1px solid #e2e8f0; border-radius:8px;">
            </div>
            <button type="submit" class="btn-admin">Authorize Access</button>
        </form>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('adminEmail').value;
            const pass = document.getElementById('adminPass').value;

            // HARDCODED SECURITY CHECK
            if (email === "adewaletunmise124@gmail.com" && pass === "Adewale@1") {
                // Create a special Admin Session
                const adminSession = {
                    email: email,
                    role: "super-admin",
                    loginTime: new Date().getTime()
                };
                localStorage.setItem('naijabiz_admin_session', JSON.stringify(adminSession));
                
                // Redirect to Panel
                window.location.href = "admin-panel.html";
            } else {
                alert("Invalid Credentials. Access Denied.");
            }
        });
    </script>
</body>
</html>
