<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Market | NaijaBiz Directory</title>
    
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/cards.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        
        .explore-hero { 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
            color: white; padding: 80px 0; text-align: center; 
        }
        .explore-hero h1 { font-family: 'Outfit', sans-serif; font-size: 3rem; margin-bottom: 15px; font-weight: 800; }
        .explore-hero p { color: #94a3b8; font-size: 1.2rem; margin-bottom: 40px; }

        .filter-container { margin-top: -40px; margin-bottom: 40px; }
        .search-box { 
            max-width: 700px; margin: 0 auto; background: white; 
            padding: 10px; border-radius: 50px; display: flex;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .search-box input { flex: 1; border: none; padding: 15px 25px; font-size: 1rem; border-radius: 50px; outline: none; }

        .category-chips { display: flex; justify-content: center; gap: 12px; margin-top: 25px; flex-wrap: wrap; }
        .chip { 
            background: white; border: 1px solid #e2e8f0; padding: 8px 20px; 
            border-radius: 50px; font-size: 0.9rem; font-weight: 600; 
            cursor: pointer; transition: all 0.2s; color: #64748b;
        }
        .chip:hover, .chip.active { background: #008751; color: white; border-color: #008751; transform: translateY(-2px); }

        .business-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; margin-top: 20px; }
        
        .vendor-card {
            background: white; border-radius: 20px; padding: 25px;
            border: 1px solid #f1f5f9; transition: all 0.3s ease;
            position: relative; overflow: hidden;
        }
        .vendor-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); }

        /* TIERED BADGE STYLES */
        .verified-tag {
            position: absolute; top: 15px; right: 15px;
            font-size: 0.7rem; font-weight: 800; padding: 4px 10px; 
            border-radius: 50px; display: flex; align-items: center; gap: 4px;
        }
        .vendor-cat-label { color: #008751; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }
        .vendor-title { font-size: 1.4rem; font-weight: 700; margin: 8px 0; color: #0f172a; }
        .vendor-snippet { color: #64748b; font-size: 0.95rem; line-height: 1.5; margin-bottom: 20px; height: 45px; overflow: hidden; }
    </style>
</head>
<body>

    <nav class="navbar" style="background: white;">
        <div class="container nav-flex">
            <a href="../index.html" class="logo">Naija<span class="highlight">Biz</span></a>
            <ul class="nav-links">
                <li><a href="dashboard.html" id="dynamicNavBtn" class="btn-primary">Dashboard</a></li>
            </ul>
        </div>
    </nav>

    <header class="explore-hero">
        <div class="container">
            <h1>Find Your Next Partner</h1>
            <p>Connect with verified Nigerian businesses in seconds.</p>
        </div>
    </header>

    <div class="container filter-container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search by name or category...">
        </div>
        <div class="category-chips" id="categoryChips">
            <div class="chip active" onclick="filterByCategory('All')">All</div>
            <div class="chip" onclick="filterByCategory('Fashion')">Fashion</div>
            <div class="chip" onclick="filterByCategory('Food')">Food</div>
            <div class="chip" onclick="filterByCategory('Tech')">Tech</div>
            <div class="chip" onclick="filterByCategory('Services')">Services</div>
        </div>
    </div>

    <section class="container" style="padding-bottom: 80px;">
        <div id="exploreGrid" class="business-grid">
            <p style="text-align:center; width:100%;">Loading the market...</p>
        </div>
    </section>

    <script type="module">
        import { db } from '../js/firebase-init.js';
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const grid = document.getElementById('exploreGrid');
        const searchInput = document.getElementById('searchInput');
        let allVendors = [];
        let currentCategory = 'All';

        async function loadVendors() {
            try {
                const querySnapshot = await getDocs(collection(db, "vendors"));
                allVendors = [];
                querySnapshot.forEach((doc) => {
                    allVendors.push({ id: doc.id, ...doc.data() });
                });
                renderGrid(allVendors);
            } catch (error) { grid.innerHTML = '<p>Error loading.</p>'; }
        }

        function renderGrid(data) {
            if (data.length === 0) {
                grid.innerHTML = '<p style="text-align:center; width:100%;">No matches found.</p>';
                return;
            }

            grid.innerHTML = data.slice().reverse().map(biz => {
                let badgeHtml = '';
                const tier = biz.verificationTier ? biz.verificationTier.toLowerCase() : 'basic';

                if (tier === 'premium') {
                    badgeHtml = `<div class="verified-tag" style="background: #fef3c7; color: #b45309; border: 1px solid #fcd34d;">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg> PREMIUM</div>`;
                } else if (tier === 'verified') {
                    badgeHtml = `<div class="verified-tag" style="background: #dbeafe; color: #1d4ed8; border: 1px solid #93c5fd;">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg> VERIFIED</div>`;
                } else {
                    badgeHtml = `<div class="verified-tag" style="background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0;">NEW</div>`;
                }

                return `
                    <div class="vendor-card">
                        ${badgeHtml}
                        <span class="vendor-cat-label">${biz.category}</span>
                        <h3 class="vendor-title">${biz.name}</h3>
                        <p class="vendor-snippet">${biz.description}</p>
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                            <a href="vendor-profile.html?id=${biz.id}" class="btn-primary" style="background:#0f172a; text-align:center; text-decoration:none; padding:12px;">View Shop</a>
                            <a href="https://wa.me/234${biz.whatsapp}" target="_blank" class="btn-primary" style="text-align:center; text-decoration:none; padding:12px;">WhatsApp</a>
                        </div>
                    </div>`;
            }).join('');
        }

        window.filterByCategory = (cat) => {
            currentCategory = cat;
            document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.textContent === cat));
            performFilter();
        };

        function performFilter() {
            const term = searchInput.value.toLowerCase();
            const filtered = allVendors.filter(v => (currentCategory === 'All' || v.category === currentCategory) && (v.name.toLowerCase().includes(term) || v.description.toLowerCase().includes(term)));
            renderGrid(filtered);
        }

        searchInput.addEventListener('keyup', performFilter);
        loadVendors();
    </script>
</body>
</html>
