<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard | NaijaBiz Directory</title>
    
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* DASHBOARD STYLES */
        .dash-header { background: #0f172a; color: white; padding: 40px 0; }
        .dash-nav { background: white; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .dash-nav ul { display: flex; list-style: none; padding: 0; margin: 0; overflow-x: auto; }
        .dash-nav li { margin-right: 20px; }
        .dash-nav a { display: block; padding: 15px 5px; color: #64748b; text-decoration: none; font-weight: 600; border-bottom: 3px solid transparent; cursor: pointer; transition: color 0.2s; }
        .dash-nav a.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }
        .dash-nav a:hover { color: var(--primary-color); }

        .tab-content { display: none; padding: 40px 0; }
        .tab-content.active { display: block; }

        /* PRODUCT LIST ITEM */
        .product-item { 
            display: flex; align-items: flex-start; 
            background: white; 
            border: 1px solid #e2e8f0; 
            padding: 15px; 
            margin-bottom: 15px; 
            border-radius: 12px; 
            transition: transform 0.2s;
        }
        .product-item:hover { transform: translateY(-2px); border-color: #cbd5e1; }
        .product-img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; background: #f1f5f9; margin-right: 15px; }
        .product-info { flex-grow: 1; }
        .delete-btn { 
            color: #ef4444; background: #fee2e2; 
            padding: 6px 12px; border-radius: 6px; 
            font-size: 0.8rem; font-weight: 600; 
            cursor: pointer; border: none; margin-top: 5px; 
        }

        /* NEW ADD PRODUCT FORM STYLES */
        .add-product-card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 1px solid #f1f5f9;
            margin-bottom: 40px;
            display: none; /* Hidden by default */
        }

        .upload-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            background: #f8fafc;
            position: relative;
        }
        .upload-zone:hover { border-color: var(--primary-color); background: #f0fdf4; }
        .upload-zone input[type="file"] {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer;
        }
        .upload-icon { font-size: 2rem; color: #94a3b8; margin-bottom: 10px; display: block; }
        .file-name { color: var(--primary-color); font-weight: 600; margin-top: 10px; display: block; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media(max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container nav-flex">
            <a href="../index.html" class="logo">Naija<span class="highlight">Biz</span></a>
            <ul class="nav-links">
                <li><a href="../index.html" onclick="logout()" style="color:red; font-weight:600;">Logout</a></li>
            </ul>
        </div>
    </nav>

    <header class="dash-header">
        <div class="container">
            <h1 id="shopNameDisplay">Loading...</h1>
            <p id="tierDisplay" style="color:#fbbf24; font-weight:bold;">...</p>
        </div>
    </header>

    <div class="dash-nav">
        <div class="container">
            <ul>
                <li><a onclick="switchTab('products')" id="tab-products" class="active">My Products</a></li>
                <li><a onclick="switchTab('settings')" id="tab-settings">Shop Settings</a></li>
                <li><a id="viewShopBtn" href="#" target="_blank">View Live Shop <span style="font-size:0.8rem;">↗</span></a></li>
            </ul>
        </div>
    </div>

    <section id="products" class="container tab-content active">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 style="font-size:1.5rem; color:#0f172a;">Inventory</h2>
            <button onclick="toggleAddForm()" class="btn-primary" style="display:flex; align-items:center; gap:8px;">
                <span>+</span> Add Product
            </button>
        </div>

        <div id="addProductForm" class="add-product-card">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <h3 style="margin:0;">Add New Product</h3>
                <button onclick="toggleAddForm()" style="background:none; border:none; color:#64748b; cursor:pointer; font-size:1.5rem;">&times;</button>
            </div>
            
            <form id="productForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Product Name</label>
                        <input type="text" id="prodName" placeholder="e.g. Nike Air Max" required>
                    </div>
                    <div class="form-group">
                        <label>Price (₦)</label>
                        <input type="number" id="prodPrice" placeholder="25000" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="prodDesc" rows="3" placeholder="Describe size, condition, color..." required></textarea>
                </div>
                
                <div class="form-group">
                    <label>Product Image</label>
                    <div class="upload-zone">
                        <span class="upload-icon">📷</span>
                        <span id="uploadText">Click here to upload product image</span>
                        <span id="fileNameDisplay" class="file-name"></span>
                        <input type="file" id="prodImageFile" accept="image/*" required onchange="updateFileName(this)">
                    </div>
                </div>

                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button type="submit" class="btn-submit" id="addProdBtn">Save Product</button>
                    <button type="button" onclick="toggleAddForm()" class="btn-submit" style="background:#f1f5f9; color:#64748b;">Cancel</button>
                </div>
            </form>
        </div>

        <div id="productList">
            <p>Loading your products...</p>
        </div>
    </section>

    <section id="settings" class="container tab-content">
        <h2>Shop Settings</h2>
        <div class="form-container" style="max-width: 100%; margin: 0; box-shadow: none; border: 1px solid #e2e8f0; border-radius:12px;">
            <form id="settingsForm">
                <div class="form-group">
                    <label>Cinematic Cover Image (URL)</label>
                    <input type="url" id="coverImage" placeholder="Paste link to your banner image...">
                    <small>For best results, use a wide, high-quality image URL.</small>
                </div>
                <button type="submit" class="btn-submit">Save Settings</button>
            </form>
        </div>
    </section>

    <footer class="main-footer">
        <div class="container" style="text-align: center; color: #94a3b8; font-size:0.9rem;">
            <p>&copy; 2026 NaijaBiz Seller Center</p>
        </div>
    </footer>

    <script type="module">
        import { db } from '../js/firebase-init.js';
        import { doc, getDoc, updateDoc, collection, addDoc, query, where, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ============================================
        // 🔴🔴🔴 PASTE YOUR IMGBB KEY HERE 🔴🔴🔴
        // ============================================
        const IMGBB_API_KEY = "531c5988d13afcc03247bc4ff85236af"; 
        // ============================================

        console.log("DASHBOARD ACTIVE (Redesign + ImgBB)");

        const sessionUser = JSON.parse(localStorage.getItem('loggedInUser'));
        if (!sessionUser || !sessionUser.id) window.location.href = 'login.html';
        const userId = sessionUser.id;

        // Load Shop
        async function loadShopData() {
            const docRef = doc(db, "vendors", userId);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('shopNameDisplay').textContent = data.name;
                document.getElementById('tierDisplay').textContent = `Tier: ${data.verificationTier || 'Basic'} Seller`;
                if(data.coverImage) document.getElementById('coverImage').value = data.coverImage;
                document.getElementById('viewShopBtn').href = `vendor-profile.html?id=${userId}`;
            }
        }
        loadShopData();

        // Load Products
        const productList = document.getElementById('productList');
        async function loadProducts() {
            productList.innerHTML = '<p>Loading...</p>';
            const q = query(collection(db, "products"), where("vendorId", "==", userId));
            const querySnapshot = await getDocs(q);
            
            if(querySnapshot.empty) {
                productList.innerHTML = `
                    <div style="text-align:center; padding:40px; color:#64748b;">
                        <p style="font-size:1.1rem;">You haven't added any products yet.</p>
                        <p>Click the <b>+ Add Product</b> button to get started!</p>
                    </div>`;
                return;
            }

            let html = '';
            querySnapshot.forEach((doc) => {
                const p = doc.data();
                html += `
                <div class="product-item">
                    <img src="${p.image}" class="product-img" alt="Product">
                    <div class="product-info">
                        <h4 style="margin:0; font-size:1.1rem; color:#0f172a;">${p.name}</h4>
                        <p style="color:#64748b; font-size:0.9rem; margin:4px 0;">${p.description || 'No description'}</p>
                        <span style="color:#008751; font-weight:700;">₦${p.price}</span>
                    </div>
                    <button class="delete-btn" onclick="window.deleteProduct('${doc.id}')">Delete</button>
                </div>
                `;
            });
            productList.innerHTML = html;
        }
        loadProducts();

        // Add Product (ImgBB)
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('addProdBtn');
            const fileInput = document.getElementById('prodImageFile');
            const file = fileInput.files[0];

            if (!file) { alert("Please select an image!"); return; }
            if (IMGBB_API_KEY.includes("PASTE")) { alert("Please put your ImgBB Key in the code!"); return; }

            try {
                btn.textContent = "Uploading Image...";
                btn.disabled = true;

                const formData = new FormData();
                formData.append("image", file);

                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: "POST", body: formData
                });
                const data = await response.json();

                if(data.success) {
                    btn.textContent = "Saving...";
                    const newProd = {
                        vendorId: userId,
                        name: document.getElementById('prodName').value,
                        description: document.getElementById('prodDesc').value,
                        price: document.getElementById('prodPrice').value,
                        image: data.data.url,
                        dateAdded: new Date().toISOString()
                    };

                    await addDoc(collection(db, "products"), newProd);
                    
                    alert("Success!");
                    document.getElementById('productForm').reset();
                    updateFileName(document.getElementById('prodImageFile')); // Reset file text
                    toggleAddForm();
                    loadProducts();
                } else {
                    alert("Image Upload Failed.");
                }
            } catch (err) { console.error(err); alert("Error connecting."); }
            btn.textContent = "Save Product";
            btn.disabled = false;
        });

        // Settings
        document.getElementById('settingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const coverUrl = document.getElementById('coverImage').value;
            try {
                const vendorRef = doc(db, "vendors", userId);
                await updateDoc(vendorRef, { coverImage: coverUrl });
                alert("Saved!");
            } catch(err) { console.error(err); }
        });

        // UI Helpers
        window.deleteProduct = async (id) => {
            if(confirm("Delete this?")) {
                await deleteDoc(doc(db, "products", id));
                loadProducts();
            }
        };
        window.logout = () => { localStorage.removeItem('loggedInUser'); window.location.href = '../index.html'; };
        window.switchTab = (id) => {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.dash-nav a').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('tab-' + id).classList.add('active');
        };
        window.toggleAddForm = () => {
            const form = document.getElementById('addProductForm');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        };
        window.updateFileName = (input) => {
            const display = document.getElementById('fileNameDisplay');
            if(input.files && input.files[0]) {
                display.textContent = "Selected: " + input.files[0].name;
            } else {
                display.textContent = "";
            }
        };
    </script>
</body>
</html>
