<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard | NaijaBiz Directory</title>
    
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/cards.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* DASHBOARD STYLES */
        .dash-header { background: #0f172a; color: white; padding: 40px 0; }
        .dash-nav { background: white; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 100; }
        .dash-nav ul { display: flex; list-style: none; padding: 0; margin: 0; overflow-x: auto; }
        .dash-nav li { margin-right: 20px; }
        .dash-nav a { display: block; padding: 15px 5px; color: #64748b; text-decoration: none; font-weight: 600; border-bottom: 3px solid transparent; cursor: pointer; }
        .dash-nav a.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }
        
        .tab-content { display: none; padding: 40px 0; }
        .tab-content.active { display: block; }

        .product-item { display: flex; align-items: flex-start; background: white; border: 1px solid #e2e8f0; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        .product-img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; background: #f1f5f9; margin-right: 15px; }
        .product-info { flex-grow: 1; }
        .delete-btn { color: #ef4444; background: #fee2e2; padding: 5px 10px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; border: none; margin-top: 5px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container nav-flex">
            <a href="../index.html" class="logo">Naija<span class="highlight">Biz</span></a>
            <ul class="nav-links">
                <li><a href="../index.html" onclick="logout()" style="color:red;">Logout</a></li>
            </ul>
        </div>
    </nav>

    <header class="dash-header">
        <div class="container">
            <h1 id="shopNameDisplay">Loading Shop...</h1>
            <p id="tierDisplay" style="color:#fbbf24; font-weight:bold;">checking tier...</p>
        </div>
    </header>

    <div class="dash-nav">
        <div class="container">
            <ul>
                <li><a onclick="switchTab('products')" id="tab-products" class="active">My Products</a></li>
                <li><a onclick="switchTab('settings')" id="tab-settings">Shop Settings</a></li>
                <li><a id="viewShopBtn" href="#" target="_blank">View Live Shop</a></li>
            </ul>
        </div>
    </div>

    <section id="products" class="container tab-content active">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Product Inventory</h2>
            <button onclick="toggleAddForm()" class="btn-primary">+ Add New Product</button>
        </div>

        <div id="addProductForm" style="display:none; background: #f8fafc; padding: 20px; border-radius: 10px; margin-bottom: 30px; border: 1px solid #cbd5e1;">
            <h3>Add New Product</h3>
            <form id="productForm">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="prodName" placeholder="e.g. Nike Air Max" required>
                </div>
                
                <div class="form-group">
                    <label>Price (₦)</label>
                    <input type="number" id="prodPrice" placeholder="25000" required>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="prodDesc" rows="3" placeholder="Size, Color, Condition..." required></textarea>
                </div>
                
                <div class="form-group">
                    <label>Product Image</label>
                    <input type="file" id="prodImageFile" accept="image/*" required style="padding: 10px; background: white; border: 1px solid #ccc; width: 100%;">
                </div>

                <button type="submit" class="btn-submit" id="addProdBtn">Save Product</button>
            </form>
        </div>

        <div id="productList">
            <p>Loading your products...</p>
        </div>
    </section>

    <section id="settings" class="container tab-content">
        <h2>Shop Settings</h2>
        <div class="form-container" style="max-width: 100%; margin: 0; box-shadow: none; border: 1px solid #e2e8f0;">
            <form id="settingsForm">
                <div class="form-group">
                    <label>Cinematic Cover Image (URL)</label>
                    <input type="url" id="coverImage" placeholder="Paste link to your banner image...">
                    <small>For now, please paste a link. We will add file upload here later.</small>
                </div>
                <button type="submit" class="btn-submit">Save Settings</button>
            </form>
        </div>
    </section>

    <footer class="main-footer">
        <div class="container" style="text-align: center; color: #888;">
            <p>&copy; 2026 NaijaBiz Seller Center</p>
        </div>
    </footer>

    <script type="module">
        import { db, storage } from '../js/firebase-init.js';
        import { doc, getDoc, updateDoc, collection, addDoc, query, where, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        console.log("DASHBOARD ACTIVE");

        // 1. Auth Check
        const sessionUser = JSON.parse(localStorage.getItem('loggedInUser'));
        if (!sessionUser || !sessionUser.id) window.location.href = 'login.html';
        const userId = sessionUser.id;

        // 2. Load Shop Data & Update View Shop Link
        async function loadShopData() {
            const docRef = doc(db, "vendors", userId);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('shopNameDisplay').textContent = data.name;
                document.getElementById('tierDisplay').textContent = `Tier: ${data.verificationTier || 'Basic'} Seller`;
                if(data.coverImage) document.getElementById('coverImage').value = data.coverImage;

                // UPDATE THE LIVE SHOP LINK HERE
                document.getElementById('viewShopBtn').href = `vendor-profile.html?id=${userId}`;
            }
        }
        loadShopData();

        // 3. Load Products
        const productList = document.getElementById('productList');
        async function loadProducts() {
            productList.innerHTML = '<p>Loading...</p>';
            const q = query(collection(db, "products"), where("vendorId", "==", userId));
            const querySnapshot = await getDocs(q);
            
            if(querySnapshot.empty) {
                productList.innerHTML = '<p>No products yet.</p>';
                return;
            }

            let html = '';
            querySnapshot.forEach((doc) => {
                const p = doc.data();
                html += `
                <div class="product-item">
                    <img src="${p.image}" class="product-img" alt="Product">
                    <div class="product-info">
                        <h4 style="margin:0;">${p.name}</h4>
                        <p style="color:#666; font-size:0.9rem; margin:5px 0;">${p.description || 'No description'}</p>
                        <span style="color:#008751; font-weight:bold;">₦${p.price}</span>
                    </div>
                    <button class="delete-btn" onclick="window.deleteProduct('${doc.id}')">Delete</button>
                </div>
                `;
            });
            productList.innerHTML = html;
        }
        loadProducts();

        // 4. Add Product
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('addProdBtn');
            const file = document.getElementById('prodImageFile').files[0];

            if (!file) { alert("Please select an image!"); return; }

            try {
                btn.textContent = "Uploading Image...";
                btn.disabled = true;

                // Upload
                const storageRef = ref(storage, `products/${userId}/${Date.now()}_${file.name}`);
                const snapshot = await uploadBytes(storageRef, file);
                const downloadURL = await getDownloadURL(snapshot.ref);

                btn.textContent = "Saving Details...";

                // Save
                const newProd = {
                    vendorId: userId,
                    name: document.getElementById('prodName').value,
                    description: document.getElementById('prodDesc').value,
                    price: document.getElementById('prodPrice').value,
                    image: downloadURL,
                    dateAdded: new Date().toISOString()
                };

                await addDoc(collection(db, "products"), newProd);
                
                alert("Product Saved!");
                document.getElementById('productForm').reset();
                toggleAddForm();
                loadProducts();

            } catch (err) {
                console.error(err);
                alert("Error saving.");
            }
            btn.textContent = "Save Product";
            btn.disabled = false;
        });

        // 5. Save Settings
        document.getElementById('settingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const coverUrl = document.getElementById('coverImage').value;
            try {
                const vendorRef = doc(db, "vendors", userId);
                await updateDoc(vendorRef, { coverImage: coverUrl });
                alert("Shop Settings Updated!");
            } catch(err) { console.error(err); alert("Failed."); }
        });

        // Helpers
        window.deleteProduct = async (id) => {
            if(confirm("Delete this product?")) {
                await deleteDoc(doc(db, "products", id));
                loadProducts();
            }
        };
        window.logout = () => { localStorage.removeItem('loggedInUser'); window.location.href = '../index.html'; };
        window.switchTab = (id) => {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.dash-nav a').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('tab-' + id).classList.add('active');
        };
        window.toggleAddForm = () => {
            const form = document.getElementById('addProductForm');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        };
    </script>
</body>
</html>
